<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matt Palermo Games</title>
<meta name="description" content="Games by Matt Palermo, playable in your browser.">
<style>
  :root {
    --bg: #0f1420; --card: #1a2133; --text: #e8ecf5; --muted: #8f9ab3;
    --accent: #4ade80; --border: #2a3450;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 48px; padding-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: clamp(2rem, 6vw, 3rem); }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; gap: 16px; margin: 32px auto; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 8px; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .card h2 { margin: 0; font-size: 1.3rem; }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .tag { align-self: flex-start; font-size: .75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px;
    background: rgba(74,222,128,.15); color: var(--accent); }
  .soon { opacity: .7; }
  .soon .tag { background: rgba(143,154,179,.18); color: var(--muted); }
  footer { color: var(--muted); font-size: .85rem; padding-bottom: 32px; }
</style>
</head>
<body>
<header>
  <h1>Games</h1>
  <p>Built with Godot. Play right in your browser.</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="simball/">
      <span class="tag">Playable</span>
      <h2>SimBall</h2>
      <p>Replace this with a one-line description of SimBall.</p>
    </a>
    <a class="card" href="simkings/">
      <span class="tag">Playable</span>
      <h2>SimKings</h2>
      <p>Replace this with a one-line description of SimKings.</p>
    </a>
    <div class="card soon" aria-disabled="true">
      <span class="tag">Coming soon</span>
      <h2>Baseball RPG</h2>
      <p>A baseball role-playing game. Stay tuned.</p>
    </div>
  </div>
</main>
<footer>&copy; Matt Palermo</footer>
</body>
</html>
